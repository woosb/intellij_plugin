kotlin.code.style=official
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# Gradle 빌드 JVM (Temurin 21)은 프로젝트별이 아닌 **사용자 home 단위**로 지정한다.
#   → ~/.gradle/gradle.properties 에 다음 한 줄을 추가:
#       org.gradle.java.home=/path/to/your/jdk-21
# 자세한 가이드는 README.md "Setup on a new Mac" 섹션 참조.
# (Kotlin 컴파일러가 JBR 25 버전 문자열을 파싱하지 못해 빌드가 실패하므로
#  반드시 JDK 21 경로를 지정해야 한다.)
