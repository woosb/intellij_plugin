<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
  <!-- Database cylinder, light theme: deep blue body -->
  <g stroke="#1a5e8a" stroke-width="1.5" stroke-linejoin="round">
    <!-- back ellipse (cylinder top) -->
    <ellipse cx="20" cy="9" rx="13" ry="3.5" fill="#3592c4"/>
    <!-- cylinder body -->
    <path d="M 7 9 L 7 28 C 7 30 12 31.5 20 31.5 C 28 31.5 33 30 33 28 L 33 9"
          fill="#3592c4"/>
    <!-- bottom ellipse outline -->
    <ellipse cx="20" cy="28" rx="13" ry="3.5" fill="none" stroke-opacity="0.5"/>
    <!-- mid stripe (cylinder seams) -->
    <path d="M 7 18 C 7 20 12 21.5 20 21.5 C 28 21.5 33 20 33 18"
          fill="none" stroke-opacity="0.35"/>
  </g>
  <!-- ODI label -->
  <text x="20" y="17.5" text-anchor="middle"
        font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif"
        font-size="6.5" font-weight="700" letter-spacing="0.5"
        fill="white">ODI</text>
</svg>
