# === Plugin description (Marketplace) ===
plugin.description=DataGrip / IntelliJ IDEA Ultimate plugin that shows Oracle dictionary information (tables, views, procedures, functions, sessions, locks) in tabbed dialogs and a dedicated tool window. Toad-style describe with data preview, paged WHERE/ORDER BY browsing, PL/SQL source with compile-error highlighting, and a live session/lock browser.
