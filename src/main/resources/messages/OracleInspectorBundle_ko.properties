# === Plugin description ===
plugin.description=DataGrip / IntelliJ IDEA Ultimate에서 Oracle 딕셔너리(테이블·뷰·프로시저·펑션·세션·락)를 탭 다이얼로그와 전용 Tool Window로 빠르게 보여주는 플러그인. Toad 스타일 Describe + 페이징 데이터 미리보기 + WHERE/ORDER BY 필터, PL/SQL 컴파일 오류 강조, 실시간 세션/락 브라우저 제공.
